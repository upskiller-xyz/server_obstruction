name: Generate Changelog

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      update_version:
        description: 'Update version in files'
        required: false
        default: 'false'

# master is protected (requires PR/review), so the changelog lands via a PR
# rather than a direct push: creating the branch needs contents:write and
# opening the PR needs pull-requests:write.
permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the exact commit the tag points at (the default for a
          # tag-push) so the generated changelog matches the release being
          # processed, not a possibly-newer default-branch tip. The detached HEAD
          # is fine: the PR step creates its own branch from this commit.
          # fetch-depth: 0 brings the full history + tags conventional-changelog needs.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install conventional-changelog-cli
        run: npm install -g conventional-changelog-cli

      - name: Generate changelog
        run: |
          # Backup existing CHANGELOG.md if it exists
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md CHANGELOG.md.bak
          fi
          
          # Generate new changelog
          conventional-changelog -p angular -i CHANGELOG.md -s
          
          # Show what changed
          echo "=== Changelog Changes ==="
          git diff --no-index CHANGELOG.md.bak CHANGELOG.md || true

      - name: Open changelog PR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The generate step leaves a .bak for the diff log; drop it so it is not
          # picked up as an untracked file.
          rm -f CHANGELOG.md.bak

          # Nothing to do if the changelog is unchanged.
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
            exit 0
          fi

          # Use the tag that triggered this run (github.ref_name), not
          # `git describe`, which could resolve to a different reachable tag.
          VERSION="${{ github.ref_name }}"
          BRANCH="changelog/${VERSION}"
          BASE="${{ github.event.repository.default_branch }}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # master is protected, so land the changelog on a dedicated branch and
          # open a PR instead of pushing to the default branch directly. Re-runs
          # of the same tag reuse the branch (force-with-lease) and the existing PR.
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${VERSION}"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists; branch updated."
          else
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "docs: update CHANGELOG.md for ${VERSION}" \
              --body "Automated changelog update for ${VERSION}."
          fi

      - name: Upload changelog as artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Create Release Notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
