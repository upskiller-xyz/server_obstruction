name: Release image

# Build + push the service image to the Scaleway registry via the shared
# composite action in infra.lux (which runs infra.lux/scripts/release.sh), then
# point the running Serverless Container at it — tag pushes only.
# Tag scheme: v1.2.0 -> 1.2.0 + latest | master -> git-describe + edge |
#             dispatch -> branch-sha (+ optional postfix). See infra.lux/README.md.
#
# Deploy needs the SCW_CONTAINER_ID variable (the Serverless Container to update;
# `scw container container list`, or the id in the console URL). Optional:
# SCW_REGION (default fr-par). The SCW_SECRET_KEY secret is the same one the
# registry push already uses.

on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:
    inputs:
      postfix:
        description: "Extra immutable tag for this manual build (e.g. rc.1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Serialize PUSH builds that move a shared tag (latest on tag pushes, edge on
  # master) so two releases can't race and leave latest/edge on the wrong image.
  # workflow_dispatch (even on master) and feature builds only produce immutable
  # branch-sha tags → key per-ref and cancel superseded runs.
  group: release-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')) && 'shared' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')) }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # release.sh needs full history + tags for `git describe`
      - uses: upskiller-xyz/infra.lux/.github/actions/release@3f016f104915545e7ae6b0ac9c59711456a800c6 # v1.0.0
        with:
          image: server-obstruction
          postfix: ${{ github.event.inputs.postfix || '' }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}

  # Scaleway never pulls on its own: a push to the registry leaves the container
  # on the digest it started with, so a release could be built and never served
  # until someone clicked Redeploy. Tag pushes only — a master build keeps
  # producing `edge` without touching prod.
  deploy:
    name: Deploy to Scaleway
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      IMAGE: rg.fr-par.scw.cloud/lux-nsp/server-obstruction
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      REGION: ${{ vars.SCW_REGION || 'fr-par' }}
      REF_NAME: ${{ github.ref_name }}
      # How long the container may take to become ready before the deploy fails.
      READY_TIMEOUT_SECONDS: "600"
      POLL_INTERVAL_SECONDS: "10"
    steps:
      - name: Update the container image and wait for it to be ready
        run: |
          set -euo pipefail

          if [ -z "${CONTAINER_ID:-}" ]; then
            echo "::error::SCW_CONTAINER_ID variable is not set — nothing tells this job which container to update (\`scw container container list\`, or the id in the console URL)."
            exit 1
          fi
          if [ -z "${SCW_SECRET_KEY:-}" ]; then
            echo "::error::SCW_SECRET_KEY secret is not set."
            exit 1
          fi

          # release.sh maps the git tag v1.2.0 to the image tag 1.2.0. The
          # immutable version tag is used, not `latest`, so the container records
          # exactly which release it serves.
          VERSION="${REF_NAME#v}"
          TARGET="${IMAGE}:${VERSION}"
          API="https://api.scaleway.com/containers/v1beta1/regions/${REGION}/containers/${CONTAINER_ID}"

          # -sS stays quiet but keeps errors; --fail-with-body returns non-zero on a
          # 4xx/5xx while still printing Scaleway's JSON, so callers can surface the
          # reason instead of just curl's exit code.
          call() {
            curl -sS --fail-with-body --max-time 30 \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              -H "Content-Type: application/json" "$@" 2>&1
          }

          echo "Pointing container ${CONTAINER_ID} at ${TARGET}"
          if ! patch_result=$(call -X PATCH "$API" \
                -d "$(jq -nc --arg image "$TARGET" '{registry_image: $image}')"); then
            echo "::error::Could not point the container at ${TARGET}: ${patch_result}"
            exit 1
          fi

          # An update starts its own deployment, but asking explicitly keeps the
          # intent independent of that behaviour. The only acceptable rejection is
          # "a deployment is already running" — a 403, a 5xx or a timeout must not
          # be mistaken for that, or a never-requested deployment would be
          # confirmed by a container that merely still reports the image we just
          # configured.
          deploy_response=$(curl -sS --max-time 30 -o - -w '\n%{http_code}' \
            -X POST "${API}/deploy" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            -H "Content-Type: application/json" 2>&1 || true)
          deploy_code="${deploy_response##*$'\n'}"
          deploy_body="${deploy_response%$'\n'*}"

          case "$deploy_code" in
            2??)
              echo "Deployment requested."
              ;;
            409|400)
              # Scaleway refuses a deploy while the container is in a transient
              # state. Only that specific reason is tolerated.
              if printf '%s' "$deploy_body" | grep -qiE 'transient|not in a stable state|already|in progress|pending|creating'; then
                echo "Deploy call refused (HTTP ${deploy_code}) — the update already started one."
              else
                echo "::error::Deploy request rejected (HTTP ${deploy_code}): ${deploy_body}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Deploy request failed (HTTP ${deploy_code:-none}): ${deploy_body}"
              exit 1
              ;;
          esac

          deadline=$(( $(date +%s) + READY_TIMEOUT_SECONDS ))
          while :; do
            if ! container=$(call "$API"); then
              echo "::error::Could not read the container's state: ${container}"
              exit 1
            fi
            status=$(printf '%s' "$container" | jq -r '.status')
            running_image=$(printf '%s' "$container" | jq -r '.registry_image')

            case "$status" in
              ready)
                if [ "$running_image" = "$TARGET" ]; then
                  echo "Container is ready on ${running_image}"
                  exit 0
                fi
                # Ready on something else means our update was overwritten (a
                # concurrent deploy) — never report that as a successful release.
                echo "::error::Container reports ready but serves ${running_image}, not ${TARGET}."
                exit 1
                ;;
              error|locked)
                echo "::error::Deployment ended in status '${status}': $(printf '%s' "$container" | jq -r '.error_message // "no message"')"
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Container did not become ready within ${READY_TIMEOUT_SECONDS}s (last status: ${status})."
              exit 1
            fi

            echo "status=${status}, waiting ${POLL_INTERVAL_SECONDS}s"
            sleep "$POLL_INTERVAL_SECONDS"
          done
