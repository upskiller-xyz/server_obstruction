[tool.poetry]
name = "Upskiller-tool"
version = "0.1.0"
description = "case study for RTE RFQ process"
authors = ["stasja fedorova <stasja.fedorova@upskiller.xyz>"]
readme = "README.md"

[tool.poetry.dependencies]
# numpy>=2.3 needs Python >=3.11; the runtime (Docker/CI) is 3.14.
python = ">=3.11,<3.15"

setuptools = ">=81.0.0,<84.0.0"

flask = "^3.0.0"
werkzeug = "^3.0.0"
requests = "^2.32.0"

# Runtime deps synced with requirements-prod.txt (same ranges) so Poetry installs
# match the Docker/prod environment.
flask-cors = ">=6.0.0,<7.0.0"
aiohttp = ">=3.14.4,<4.0.0"
numpy = ">=2.3.3,<3.0.0"
orjson = ">=3.11.4,<4.0.0"
gunicorn = ">=23.0.0,<24.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
pydantic = ">=2.12.0,<3.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
coverage = "7.10.7"
pyfakefs = "5.7.4"
mypy = "1.14.0"
ruff = "0.9.4"
pre-commit = "3.5.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.1"
mkdocstrings-python = "1.10.9"


[tool.poetry.scripts]


[[tool.poetry.source]]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disable_error_code = ["import-untyped", "no-any-return"]
explicit_package_bases = true

[tool.ruff]
[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["Upskiller-torch"]